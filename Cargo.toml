[workspace]
resolver = "2"
members = ["crates/qftp-common", "crates/qftp-server", "crates/qftp-client", "crates/qftp-admin", "crates/qftp-bench"]
# fuzz/ is a separate, nightly-only workspace driven by cargo-fuzz; keep
# it out of the main workspace so `cargo build --workspace` on stable
# doesn't try to compile libfuzzer-sys.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/khm39/qftp"
description = "QUIC File Transfer Protocol"
readme = "README.md"
authors = ["qftp contributors"]
