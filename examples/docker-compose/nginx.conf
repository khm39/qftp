# Terminates HTTPS for the qftp web SPA and reverse-proxies it to the
# bridge's plain-HTTP listener.
#
# This proxies the *static page* only (index.html, app.js, style.css,
# config.json). It does NOT proxy WebTransport: that is HTTP/3 over UDP
# and the browser connects to qftp-web-bridge:4433 directly.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    # The SPA is a handful of small files; no body uploads pass here.
    client_max_body_size 1m;

    location / {
        proxy_pass http://qftp-web-bridge:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
