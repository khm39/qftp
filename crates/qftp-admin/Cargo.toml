[package]
name = "qftp-admin"
description = "QUIC File Transfer Protocol -- ops CLI (users.toml editor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
qftp-protocol = { path = "../qftp-protocol" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"

[package.metadata.deb]
maintainer = "khm39 <khm39@kuraft.com>"
copyright = "2026 khm39 <khm39@kuraft.com>"
extended-description = """\
Ops-side CLI for editing qftp-server's users.toml."""
section = "net"
priority = "optional"
assets = [
    ["target/release/qftp-admin", "/usr/bin/", "755"],
]
depends = "qftp-server"
