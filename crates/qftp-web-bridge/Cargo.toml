[package]
name = "qftp-web-bridge"
description = "QUIC File Transfer Protocol -- WebTransport bridge for browser clients."
version.workspace = true
edition.workspace = true
# wtransport (quinn-based) requires a newer compiler than the quiche
# crates; the rest of the workspace stays on 1.85.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
qftp-common = { path = "../qftp-common" }
qftp-protocol = { path = "../qftp-protocol" }
wtransport = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ring = "0.17"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
# The e2e test drives the bridge over a real WebTransport connection;
# it needs tokio timers (startup-wait retry) and a TCP client (to
# check the SPA HTTP listener).
tokio = { version = "1", features = ["time", "net"] }

[package.metadata.deb]
maintainer = "khm39 <khm39@kuraft.com>"
copyright = "2026 khm39 <khm39@kuraft.com>"
extended-description = """\
WebTransport (HTTP/3) bridge that serves qftp to browser clients,
with the single-page web client embedded. Bearer-token auth,
origin allowlisting, BLAKE3 integrity end-to-end in the browser."""
section = "net"
priority = "optional"
assets = [
    ["target/release/qftp-web-bridge", "/usr/bin/", "755"],
    ["../../README.md", "/usr/share/doc/qftp-web-bridge/README.md", "644"],
    ["../../docs/web-client.md", "/usr/share/doc/qftp-web-bridge/web-client.md", "644"],
    ["../../LICENSE.md", "/usr/share/doc/qftp-web-bridge/LICENSE.md", "644"],
]
