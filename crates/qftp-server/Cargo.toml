[package]
name = "qftp-server"
description = "QUIC File Transfer Protocol -- server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
qftp-common = { path = "../qftp-common" }
qftp-protocol = { path = "../qftp-protocol" }
quiche = "0.24"
rcgen = "0.13"
mio = { version = "1", features = ["net", "os-poll"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ring = "0.17"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
x509-parser = "0.16"
blake3 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
quiche = "0.24"
qftp-common = { path = "../qftp-common" }

[package.metadata.deb]
maintainer = "qftp contributors"
copyright = "MIT OR Apache-2.0"
extended-description = """\
Modern, secure file-transfer server built on QUIC + TLS 1.3.
mTLS authentication, per-user ACLs, BLAKE3 integrity, 0-RTT
session resumption, Prometheus metrics."""
section = "net"
priority = "optional"
assets = [
    ["target/release/qftp-server", "/usr/bin/", "755"],
    ["../../examples/systemd/qftp-server.service", "/lib/systemd/system/", "644"],
    ["../../README.md", "/usr/share/doc/qftp-server/README.md", "644"],
    ["../../LICENSE-MIT", "/usr/share/doc/qftp-server/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "/usr/share/doc/qftp-server/LICENSE-APACHE", "644"],
]
