[package]
name = "qftp-protocol"
description = "QUIC File Transfer Protocol -- transport-independent request handling, ACLs, and user directory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
qftp-common = { path = "../qftp-common" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
x509-parser = "0.16"
blake3 = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
rcgen = "0.13"
