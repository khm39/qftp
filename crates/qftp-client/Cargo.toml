[package]
name = "qftp-client"
description = "QUIC File Transfer Protocol -- client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
qftp-common = { path = "../qftp-common" }
qftp-protocol = { path = "../qftp-protocol" }
quiche = "0.24"
mio = { version = "1", features = ["net", "os-poll"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rustyline = { version = "15", features = ["derive"] }
ring = "0.17"
blake3 = "1"
indicatif = "0.18"
glob = "0.3"
url = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "8"
x509-parser = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"


[package.metadata.deb]
maintainer = "khm39 <khm39@kuraft.com>"
copyright = "2026 khm39 <khm39@kuraft.com>"
extended-description = """\
Modern QUIC-based file-transfer client. URL syntax, host aliases,
SSH-style TOFU, 0-RTT resumption, scp-compatible one-shot subcommands."""
section = "net"
priority = "optional"
assets = [
    ["target/release/qftp-client", "/usr/bin/", "755"],
    ["../../README.md", "/usr/share/doc/qftp-client/README.md", "644"],
    ["../../LICENSE-MIT", "/usr/share/doc/qftp-client/LICENSE-MIT", "644"],
]
