[package]
name = "qftp-client"
version = "0.1.0"
edition = "2021"

[dependencies]
qftp-common = { path = "../qftp-common" }
quiche = "0.22"
mio = { version = "1", features = ["net", "os-poll"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rustyline = "15"
ring = "0.17"
