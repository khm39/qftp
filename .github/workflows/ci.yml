name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily run so a freshly published RUSTSEC advisory against a pinned
  # dependency is caught even when no PR lands. 05:17 UTC, off-peak.
  schedule:
    - cron: "17 5 * * *"

# Cancel in-progress runs when new commits land on the same ref so we don't
# burn runner minutes on superseded commits. Don't cancel scheduled runs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      # spec/ is the source of truth; test-vectors/ pin the bytes on the
      # wire. Regenerate them from the reference impl and fail if they
      # drift, so a wire-format change that forgets to update the vectors
      # (and thus the spec) cannot land. See test-vectors/README.md.
      - name: Conformance vectors are in sync
        run: |
          cargo run -p qftp-conformance --bin gen-vectors
          git diff --exit-code test-vectors/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test web/blake3.js against Rust blake3 vectors
        run: node web/blake3.test.js

  deny:
    name: cargo-deny (advisories / licenses / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # Report coverage but don't gate on a threshold yet (start loose,
      # tighten once a baseline exists). The e2e tests need a built
      # client/server binary, so exclude them here -- they don't
      # contribute line coverage of the crates under test anyway.
      - name: Coverage
        run: cargo llvm-cov --workspace --lib --summary-only
      - name: Coverage (lcov artifact)
        run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info
      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
