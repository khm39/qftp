name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when new commits land on the same ref so we don't
# burn runner minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  isolation:
    name: OS user isolation e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # The dispatcher must setuid, so the e2e test runs as root via
      # sudo; the binaries are built first as the unprivileged runner
      # user and reused (QFTP_ISO_SKIP_BUILD=1).
      - name: Build server and client
        run: cargo build -p qftp-server -p qftp-client

      - name: Isolation end-to-end test (privileged)
        run: sudo env QFTP_ISO_SKIP_BUILD=1 bash scripts/isolation-test.sh
