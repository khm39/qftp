name: release

# Build and publish release artifacts when a vX.Y.Z tag is pushed.
# Uses cargo-dist (axodotdev) to produce per-platform tarballs +
# checksums + a GitHub Release. Configure cargo-dist's metadata by
# running `cargo dist init` locally if the workflow ever needs tuning.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0). Must already exist."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Release gate: never publish a tag whose tests don't pass. The tag
  # is built directly by the jobs below without going through ci.yml,
  # so run the test suite here against the exact ref being released.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On workflow_dispatch GITHUB_REF is the default branch, not the
      # tag; check out the requested tag explicitly so every job in
      # this workflow builds the bytes being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # `ref`: on workflow_dispatch GITHUB_REF is the default branch;
      # without this the dispatch path would silently build and ship
      # whatever main happened to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain (linux/aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # quiche's default `boringssl-vendored` feature builds BoringSSL
          # via cmake, whose CMakeLists declares LANGUAGES C CXX -- so the
          # aarch64 C++ cross compiler is required, not just the C one.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --workspace --bins --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # `inputs.tag` wins on workflow_dispatch: GITHUB_REF_NAME is
          # always set (to the *branch* name on dispatch), so a
          # `${GITHUB_REF_NAME:-...}` fallback would never fire and the
          # artifacts would be named after the branch.
          tag="${{ inputs.tag || github.ref_name }}"
          dir="qftp-${tag}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/qftp-server "$dir/"
          cp target/${{ matrix.target }}/release/qftp-client "$dir/"
          cp target/${{ matrix.target }}/release/qftp-admin "$dir/"
          cp target/${{ matrix.target }}/release/qftp-web-bridge "$dir/"
          cp README.md CHANGELOG.md LICENSE.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          # macOS ships shasum but not coreutils' sha256sum; the Linux
          # runners are the other way round. Pick whichever is present
          # so the matrix doesn't fail on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            qftp-*.tar.gz
            qftp-*.tar.gz.sha256

  # Build .deb packages for the Linux matrix. cargo-deb consumes
  # the `[package.metadata.deb]` section in each binary crate's
  # Cargo.toml.
  deb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      # See the build job for why `ref` matters on workflow_dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install --locked cargo-deb
      - name: Install cross compiler (aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # See the build job: BoringSSL's cmake build needs the C++ cross
          # compiler too, so cargo-deb's aarch64 build can link.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build .deb packages
        run: |
          set -euo pipefail
          for pkg in qftp-server qftp-client qftp-admin qftp-web-bridge; do
            cargo deb --target ${{ matrix.target }} -p "$pkg" --no-strip
          done
          mkdir -p dist-deb
          find target/${{ matrix.target }}/debian -name '*.deb' -exec cp {} dist-deb/ \;
          ls -la dist-deb/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: dist-deb/*.deb

  publish:
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job: point gh at the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # See the Package step for why `inputs.tag` must win on
          # workflow_dispatch (GITHUB_REF_NAME is the branch there).
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" --generate-notes \
            $(find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.deb' \))
